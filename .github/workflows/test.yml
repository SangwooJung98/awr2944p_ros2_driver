name: ROS 2 Jazzy tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 15
    env:
      ROS_DOMAIN_ID: '173'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pytest python3-serial ros-jazzy-rviz2 ros-jazzy-tf2-ros ros-jazzy-diagnostic-msgs
      - name: Check fixtures and build
        run: |
          python3 tools/generate_sample.py --check
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --symlink-install --packages-select awr2944_driver
      - name: Test without radar hardware
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          cd ros2_ws
          colcon test --packages-select awr2944_driver --event-handlers console_direct+
          colcon test-result --verbose
